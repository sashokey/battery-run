name: Release

on:
  push:
    branches: [master]
    paths: [.github/release.json]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Test and package release
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Run tests
        run: bash run-tests.sh --without-battery
      - name: Build and verify signed ZIP
        run: |
          version="$(jq -er '.version | select(test("^[0-9]+\\.[0-9]+(\\.[0-9]+)?$"))' .github/release.json)"
          bash package.sh "$version"
      - name: Upload verified ZIP
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: battery-run-release
          path: dist/Battery-Run-*.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Download verified ZIP
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: battery-run-release
          path: dist
      - name: Tag tested commit and publish ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          metadata=.github/release.json
          version="$(jq -er '.version | select(test("^[0-9]+\\.[0-9]+(\\.[0-9]+)?$"))' "$metadata")"
          jq -e '(.draft | type == "boolean") and (.prerelease | type == "boolean") and (.notes | type == "string")' "$metadata" >/dev/null
          jq -r .notes "$metadata" > "$RUNNER_TEMP/release-notes.md"
          package="dist/Battery-Run-$version.zip"
          test -s "$package"
          tag="v$version"
          endpoint="repos/$GITHUB_REPOSITORY/git"
          if ! tagged_sha="$(gh api "$endpoint/ref/tags/$tag" --jq .object.sha)"; then
            tagged_sha="$(gh api --method POST "$endpoint/refs" --field "ref=refs/tags/$tag" --field "sha=$GITHUB_SHA" --jq .object.sha)"
          fi
          if [ "$tagged_sha" != "$GITHUB_SHA" ]; then
            echo "Release tag $tag does not point to the tested commit" >&2
            exit 1
          fi
          flags=()
          if jq -e .prerelease "$metadata" >/dev/null; then
            flags+=(--prerelease)
          fi
          if jq -e .draft "$metadata" >/dev/null; then
            flags+=(--draft)
          fi
          gh release create "$tag" "$package" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Battery Run $version" --notes-file "$RUNNER_TEMP/release-notes.md" "${flags[@]}"
