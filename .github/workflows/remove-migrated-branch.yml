name: Remove migrated main branch

on:
  push:
    branches: [master]
    paths: [.github/workflows/remove-migrated-branch.yml]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.repository == 'sashokey/battery-run' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Remove only the fully migrated main ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repo="repos/$GITHUB_REPOSITORY"
          expected=ca3c10e8ddb4e7943d203e4593689a80bf181f7a
          test "$(gh api "$repo" --jq .default_branch)" = master
          comparison="$(gh api "$repo/compare/$expected...master" --jq .status)"
          test "$comparison" = ahead || test "$comparison" = identical
          test "$(gh api "$repo/git/ref/heads/main" --jq .object.sha)" = "$expected"
          gh api --method DELETE "$repo/git/refs/heads/main"
